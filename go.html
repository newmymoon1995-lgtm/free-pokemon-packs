<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claiming your bonus…</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#05070e;color:#eef2f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
h1{font-size:clamp(22px,5vw,32px);font-weight:900;background:linear-gradient(90deg,#ffd700,#ff9a3c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.sub{color:#8b93a7;font-size:14px;text-align:center}
.barwrap{width:min(360px,82vw);height:6px;background:#1e2a45;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#ffd700,#ff9a3c);transition:width 2s linear;border-radius:99px}
.btn{display:inline-block;background:linear-gradient(90deg,#ffd700,#ff9a3c);color:#111;font-weight:900;padding:14px 34px;border-radius:14px;text-decoration:none;font-size:16px;box-shadow:0 6px 24px #ffd70030;cursor:pointer;border:none}
.btn:hover{transform:scale(1.05)}
.count{font-family:monospace;color:#ffd700;font-size:15px}
</style>
</head>
<body>
<h1>🎁 Your bonus is loading…</h1>
<div class="sub">Redirecting in <span class="count" id="cd">2</span>s</div>
<div class="barwrap"><div class="bar" id="bar"></div></div>
<button class="btn" id="go">Continue to bonus →</button>
<script>
const p=new URLSearchParams(location.search);
let dest=p.get('to')||'';
if(!/^https?:\/\//i.test(dest)) dest='index.html';
const cd=document.getElementById('cd');
document.getElementById('go').onclick=()=>{location.href=dest};
requestAnimationFrame(()=>document.getElementById('bar').style.width='100%');
let s=2;const iv=setInterval(()=>{s--;cd.textContent=Math.max(0,s);if(s<=0){clearInterval(iv);location.href=dest}},1000);
</script>
</body>
</html>
